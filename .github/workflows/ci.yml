name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_STORE_DIR: .pnpm-store

jobs:
  database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kelsier_dev
          POSTGRES_USER: kelsier
          POSTGRES_PASSWORD: kelsier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kelsier:kelsier@localhost:5432/kelsier_dev
      ALLOW_SEED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native tooling
        run: pnpm rebuild

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Verify seed is idempotent
        run: pnpm db:seed

  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kelsier_dev
          POSTGRES_USER: kelsier
          POSTGRES_PASSWORD: kelsier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kelsier:kelsier@localhost:5432/kelsier_dev
      ALLOW_SEED: "true"
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://kelsier:kelsier@localhost:5432/kelsier_dev

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Restore pnpm store
        id: restore-pnpm-store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Rebuild approved native tooling
        run: pnpm rebuild

      - name: Check version metadata
        if: github.event_name == 'pull_request'
        run: pnpm version:check

      - name: Save pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-pnpm-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Playwright browsers
        id: restore-playwright-browsers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Save Playwright browsers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-playwright-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint and format checks
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Validate Worker deployment configuration
        run: pnpm worker:check

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Prepare assessment database for E2E
        run: pnpm db:migrate && pnpm db:seed

      - name: E2E tests
        run: pnpm test:e2e

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_STORE_DIR: .pnpm-store

jobs:
  database:
    # Keep browser/native-tooling validation stable during runner image rollouts.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675 # 17.11
        env:
          POSTGRES_DB: kelsier_dev
          POSTGRES_USER: kelsier
          POSTGRES_PASSWORD: kelsier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kelsier:kelsier@localhost:5432/kelsier_dev
      ALLOW_SEED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.11.1 <27.0.0"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native tooling
        run: pnpm rebuild

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Verify seed is idempotent
        run: pnpm db:seed

      - name: Verify assessment database integrity
        run: pnpm test src/db/assessmentIntegrity.test.ts
        env:
          RUN_DB_TESTS: "true"

  validate:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675 # 17.11
        env:
          POSTGRES_DB: kelsier_dev
          POSTGRES_USER: kelsier
          POSTGRES_PASSWORD: kelsier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kelsier:kelsier@localhost:5432/kelsier_dev
      ALLOW_SEED: "true"
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://kelsier:kelsier@localhost:5432/kelsier_dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Explicit restore/save steps below restrict cache writes to main.
          cache: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.11.1 <27.0.0"
          package-manager-cache: false

      - name: Restore pnpm store
        id: restore-pnpm-store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit package signatures
        run: pnpm audit signatures

      - name: Audit known vulnerabilities
        run: pnpm audit --audit-level high

      - name: Rebuild approved native tooling
        run: pnpm rebuild

      - name: Check version metadata
        if: github.event_name == 'pull_request'
        run: pnpm version:check

      - name: Save pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-pnpm-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Playwright browsers
        id: restore-playwright-browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Save Playwright browsers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-playwright-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint and format checks
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Validate Worker deployment configuration
        run: pnpm worker:check

      - name: Prepare assessment database for E2E
        run: pnpm db:migrate && pnpm db:seed

      - name: E2E tests
        run: pnpm test:e2e

name: Sync theming experiment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-experiment-theming
  cancel-in-progress: false

jobs:
  merge-main:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout theming experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: experiment/theming
          fetch-depth: 0
          # This job pushes the merge; validation/review jobs disable credentials.
          persist-credentials: true

      - name: Merge main into theming experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          git push origin HEAD:experiment/theming

services:
  postgres:
    # Keep the local engine aligned with both CI database services.
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    container_name: kelsier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kelsier_dev
      POSTGRES_USER: kelsier
      POSTGRES_PASSWORD: kelsier
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelsier -d kelsier_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - kelsier-postgres-data:/var/lib/postgresql/data

volumes:
  kelsier-postgres-data:

#   esbuild 0.28.1       — GHSA-g7r4-m6w7-qqqr; parent: tsx
#   launch-editor 2.14.1 — GHSA-v6wh-96g9-6wx3; parent: @tanstack/devtools-vite
#   shell-quote 1.9.0    — GHSA-w7jw-789q-3m8p (shell injection); parent: launch-editor
#   undici 7.28.0        — GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q, GHSA-hm92-r4w5-c3mj; parents: jsdom, miniflare
#   ws 8.21.0            — GHSA-58qx-3vcg-4xpx, GHSA-96hv-2xvq-fx4p; parents: @cloudflare/vite-plugin, @tanstack/devtools-event-bus, miniflare
overrides:

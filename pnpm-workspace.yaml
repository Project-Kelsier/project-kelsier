  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "@cloudflare/vite-plugin>ws": "8.21.0"
  "@tanstack/devtools-event-bus>ws": "8.21.0"
  "@tanstack/devtools-vite>launch-editor": "2.14.1"
  "jsdom>undici": "7.28.0"
  "launch-editor>shell-quote": "1.9.0"
  "miniflare>undici": "7.28.0"
  "miniflare>ws": "8.21.0"
